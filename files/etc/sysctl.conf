# ============================================
# Xiaomi Mi Router 4A Gigabit Gaming & Low-Latency
# 128MB RAM | MT7621A | Dual-Core 880MHz
# ============================================
# NOT: Asagidaki ayarlar baska kaynaklardan yonetilir:
#   - nf_conntrack_max, nfnetlink_queue_maxlen, netdev_max_backlog,
#     nf_conntrack_udp_timeout_stream  -> /etc/init.d/zapret
#   - tcp_fastopen, nf_conntrack_tcp_timeout_established,
#     nf_conntrack_tcp_timeout_time_wait -> /etc/config/system (UCI)

# === TCP Congestion Control ===
net.ipv4.tcp_congestion_control=westwood
net.ipv4.tcp_ecn=1
net.ipv4.tcp_slow_start_after_idle=0
net.ipv4.tcp_no_metrics_save=1
net.ipv4.tcp_fin_timeout=15
net.ipv4.tcp_tw_reuse=1

# === TCP Notsent Lowat (buffer bloat onleme - gaming) ===
net.ipv4.tcp_notsent_lowat=16384

# === Buffer Tuning (128MB RAM / MT7621 dual-core uyumlu) ===
net.core.netdev_budget=600
net.core.netdev_budget_usecs=3000
net.core.rmem_max=524288
net.core.wmem_max=524288
net.core.rmem_default=262144
net.core.wmem_default=262144
net.ipv4.tcp_rmem=4096 131072 524288
net.ipv4.tcp_wmem=4096 131072 524288

# === Connection Backlog (128MB RAM icin optimize) ===
net.core.somaxconn=4096

# === AQM / Bufferbloat (fq_codel kernel built-in) ===
net.core.default_qdisc=fq_codel

# === TIME_WAIT limiti (128MB RAM uyumlu) ===
net.ipv4.tcp_max_tw_buckets=4096

# === Ephemeral Port Araligi (Servis portlari korumali) ===
net.ipv4.ip_local_port_range=10240 65535

# === Keepalive (Ghost connection temizligi) ===
net.ipv4.tcp_keepalive_time=300
net.ipv4.tcp_keepalive_intvl=15
net.ipv4.tcp_keepalive_probes=3

# === Conntrack (Zapret harici) ===
net.netfilter.nf_conntrack_udp_timeout=30

# === RAM & Swap Yonetimi ===
vm.swappiness=10
